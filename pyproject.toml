[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "reachy_language_tutor"
version = "0.1.0"
description = "Voice language tutor for Reachy Mini, powered by ElevenLabs Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "numpy",
    "websockets>=12",
    "httpx",
    "python-dotenv",
]
keywords = ["reachy-mini-app", "language", "tutor", "elevenlabs", "voice"]

[project.entry-points."reachy_mini_apps"]
reachy_language_tutor = "reachy_language_tutor.main:ReachyLanguageTutor"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
reachy_language_tutor = ["**/*"]
