<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beating in Sync</title>
<style>
  :root { --bg: #000; --ink: rgba(255,255,255,.82); --soft: rgba(255,255,255,.45); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .caption { position: fixed; left: 0; right: 0; bottom: 6vh; text-align: center; color: var(--ink);
    font: 300 clamp(16px, 2.4vw, 34px)/1.3 -apple-system, system-ui, sans-serif; letter-spacing: .04em;
    transition: opacity 1.2s; pointer-events: none; }
  .bpm { position: fixed; right: 4vw; top: 4vh; color: var(--soft); font: 200 clamp(22px, 4vw, 64px)/1 -apple-system, system-ui, sans-serif;
    transition: opacity 1s; font-variant-numeric: tabular-nums; }
  .bpm small { font-size: .35em; letter-spacing: .1em; margin-left: .3em; }
  .help { position: fixed; left: 16px; top: 12px; color: var(--soft); font: 12px -apple-system, system-ui, sans-serif; opacity: 0; transition: opacity .4s; }
  body:hover .help { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bpm" id="bpm"></div>
<div class="caption" id="caption"></div>
<div class="help">F full screen · space tap a beat · H hide numbers</div>
<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
}
addEventListener("resize", resize); resize();

const CAPTIONS = {
  waiting: "Rest a finger on the sensor to wake Reachy",
  waking: "Something stirs…",
  syncing: "Reachy is feeling your heartbeat",
  connected: "",
  searching: "Reachy is looking for you",
  goodbye: "Goodbye for now",
};

// Live state from the app, plus smoothed values for drawing.
let S = { state: "waiting", bpm: 0, finger: false, beats: 0, signal: [], speaking: false };
let lastBeats = null, pulse = 0, energy = 0, hue = 200, presence = 0, speak = 0, showNumbers = true;
const ripples = [];

function connect() {
  const es = new EventSource("/api/heart/stream");
  es.onmessage = (e) => {
    S = JSON.parse(e.data);
    if (lastBeats !== null && S.beats > lastBeats && S.finger) onBeat();
    lastBeats = S.beats;
  };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}
connect();

function onBeat() {
  pulse = 1;
  ripples.push({ t: performance.now(), hue });
  if (ripples.length > 12) ripples.shift();
}

// Slow pulse = deep blues and teals; fast pulse = magenta and warm orange.
function targetHue(bpm) {
  if (!bpm) return 205;
  const k = Math.max(0, Math.min(1, (bpm - 55) / 60));
  return 200 + k * 150; // 200 (blue) -> 350 (magenta-red)
}

const RIBBONS = 7;
let t0 = performance.now(), last = t0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000;
  const alive = S.finger && !S.sleeping;
  presence += ((alive ? 1 : 0.18) - presence) * (1 - Math.exp(-dt / 1.2));
  speak += ((S.speaking ? 1 : 0) - speak) * (1 - Math.exp(-dt / 0.3));
  const arousal = S.bpm ? Math.max(0, Math.min(1, (S.bpm - 55) / 55)) : 0.25;
  energy += (arousal - energy) * (1 - Math.exp(-dt / 2.5));
  hue += (targetHue(S.bpm) - hue) * (1 - Math.exp(-dt / 2.0));
  pulse *= Math.exp(-dt / 0.22);

  // Trails: fade the previous frame instead of clearing, for silky motion.
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = `rgba(0,0,0,${0.16 + 0.1 * (1 - presence)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";

  // Ribbons of light, flowing faster and taller with a faster heart, swelling on each beat.
  const speed = 0.25 + 0.6 * energy;
  for (let r = 0; r < RIBBONS; r++) {
    const ph = r * 1.7, hueR = (hue + r * 18 - 50 + 360) % 360;
    const amp = H * (0.08 + 0.12 * energy + 0.09 * pulse) * (0.6 + 0.4 * Math.sin(ph + t * 0.2)) * (0.4 + 0.6 * presence);
    const yMid = H * (0.5 + 0.18 * Math.sin(ph * 1.3 + t * 0.07));
    ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 12 * DPR) {
      const u = x / W;
      const y = yMid
        + amp * Math.sin(u * (3 + r * 0.4) * Math.PI + t * speed * (1 + r * 0.15) + ph)
        + amp * 0.35 * Math.sin(u * 9 * Math.PI - t * speed * 1.7 + ph)
        + speak * H * 0.012 * Math.sin(u * 60 + t * 25 + r);
      x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    const a = (0.05 + 0.12 * presence + 0.25 * pulse) / (1 + r * 0.12);
    ctx.strokeStyle = `hsla(${hueR}, 90%, ${55 + 15 * pulse}%, ${a})`;
    ctx.lineWidth = (2 + 10 * presence + 14 * pulse) * DPR / (1 + r * 0.3);
    ctx.shadowColor = `hsla(${hueR}, 100%, 60%, ${0.8 * presence})`;
    ctx.shadowBlur = 30 * DPR;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // Each beat sends a soft ring out from the center, where Reachy "is".
  for (const rp of ripples) {
    const age = (now - rp.t) / 1000;
    if (age > 3.5) continue;
    const rad = (0.05 + age * 0.32) * Math.max(W, H);
    ctx.beginPath();
    ctx.arc(W / 2, H * 0.48, rad, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${rp.hue}, 95%, 65%, ${0.22 * (1 - age / 3.5)})`;
    ctx.lineWidth = (6 - age) * 3 * DPR;
    ctx.stroke();
  }

  // The live pulse waveform, as a thin glowing trace across the bottom.
  const sig = S.signal || [];
  if (sig.length > 2 && S.finger) {
    ctx.beginPath();
    const base = H * 0.86, h = H * 0.05;
    sig.forEach((v, i) => {
      const x = (i / (sig.length - 1)) * W, y = base - Math.max(-1.2, Math.min(1.5, v)) * h;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.strokeStyle = `hsla(${hue}, 100%, 75%, 0.35)`;
    ctx.lineWidth = 2 * DPR;
    ctx.stroke();
  }

  const cap = S.state === "waiting" && S.finger ? "" : (CAPTIONS[S.state] ?? "");
  const capEl = document.getElementById("caption");
  if (capEl.textContent !== cap) capEl.textContent = cap;
  capEl.style.opacity = cap ? 1 : 0;
  const bpmEl = document.getElementById("bpm");
  bpmEl.style.opacity = showNumbers && S.finger && S.bpm ? 1 : 0;
  if (S.bpm) bpmEl.innerHTML = `${Math.round(S.bpm)}<small>BPM</small>`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (e.key === "h" || e.key === "H") showNumbers = !showNumbers;
  if (e.code === "Space") { e.preventDefault(); fetch("/api/heart/beat", { method: "POST" }); }
});
</script>
</body>
</html>
